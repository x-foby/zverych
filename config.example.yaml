# Скопируйте в config.yaml и отредактируйте. Секреты — в .env.

telegram:
  # Создатели бота — Telegram ID (узнать свой — написать @userinfobot). Добавить бота в группу
  # может кто угодно, но там он молчит и ничего не хранит, пока создатель в личке с ботом не
  # включит группу: назовёт её, админа (или нескольких) и режим — тишина, только реакции или
  # общение. Дальше группой управляют её админы; у создателя остаются только назначение и
  # снятие админов и отключение группы (со стиранием всего, что бот о ней знает).
  admin_ids: []
  # Слова, которые считаются обращением к боту (кроме @username и reply), в нижнем регистре.
  aliases: []

behavior:
  # Как часто модель оценивает новые сообщения: одним запросом на все сообщения за интервал решает,
  # на какие поставить реакцию или ответить, и выполняет указания руководства («ставь ❤ на мои
  # сообщения», «на упоминание X отвечай …»). Обращения к боту и сами указания обрабатываются сразу.
  batch_interval_seconds: 3600
  context_messages: 30         # сколько сообщений до пачки давать модели как историю (пачка — целиком,
                               # до 200 последних; локальная модель на CPU — 20); в ответе — последние
                               # сообщения ветки (треда) или топика
  thread_head_messages: 3      # ответ в ветке: её первые сообщения, если ветка длиннее context_messages
  around_messages: 10          # ответ в ветке: последние сообщения топика вне её («что ещё происходит»)
  thread_active_hours: 6       # сообщение без reply модель может отнести по смыслу к ветке топика,
  thread_candidates: 10        # активной за эти часы (не больше стольких последних веток)
  # Сводка старой переписки топика: когда в нём набирается столько сообщений старше последних
  # context_messages (их модель видит и так), модель фильтра пересказывает их вместе с прежней сводкой.
  # Сводка идёт в ответы и в оценку, хранится бессрочно; админ чата видит её в «что ты помнишь?» и может стереть.
  summary_chunk_messages: 40
  summary_max_chars: 1500      # длина сводки одного топика (~400 токенов)
  # Заметки об участниках обновляются вместе со сводкой (по авторам той же порции): как к человеку
  # относится чат (с репутацией −2…+2) и впечатление бота о нём. Идут в ответы и в оценку.
  note_max_chars: 300          # длина каждой из двух частей заметки
  # Лор, который бот выделяет сам (шутки, правила, традиции, термины), — тоже по порциям сводки, для топика
  # или всего чата. Указания и записи руководства важнее и в лимит не входят; админ видит всё в «что ты помнишь?».
  lore_max_entries: 30         # сколько таких записей держать в чате (дальше — только замена своих)
  lore_max_chars: 200          # длина одной записи
  cooldown_minutes: 15         # минимум между непрошеными репликами в одном чате (реакции и действия
                               # по указаниям — без ограничения)
  reply_delay_min_seconds: 3   # «человеческая» задержка перед отправкой
  reply_delay_max_seconds: 12
  max_consecutive_own: 2       # не встревать, если последние N сообщений — свои
  dialog_minutes: 10           # с кем бот говорил за это время (в том же топике), тому реплика — ответ, без cooldown
  # Собеседник бота, который пишет без имени и reply, не ждёт пачку: бот ждёт столько секунд его тишины
  # и оценивает чат сразу. Новое сообщение от него начинает ожидание заново и отменяет оценку и ответ,
  # пока бот ничего не сделал в чате (Telegram не сообщает боту, что человек печатает).
  dialog_wait_seconds: 15
  stale_after_minutes: 30      # после офлайна не отвечать на обращения старше этого
  offline_reaction: "😴"       # реакция на обращение, когда модель недоступна; "" — не ставить
  retention_days: 30
  # Привычки топика: если люди ставят одну реакцию на сообщения одного типа (вступления / обычные
  # сообщения) — минимум на habit_min_messages из них и на долю не меньше habit_min_share, — модель
  # получает это как подсказку («Местные обычаи») и сама решает, следовать ли. habit_min_share: 2 — выключить.
  habit_min_messages: 3
  habit_min_share: 0.5

quota:
  reserve_for_mentions: 0.2    # доля суточной квоты только под прямые обращения

llm:
  timeout_seconds: 60          # облачная модель отвечает за секунды; для локальной на CPU — 300
  # Повтор запроса к тому же провайдеру при временной ошибке (5xx, сервер не отвечает или
  # оборвал соединение). Таймаут не повторяется. Только после исчерпания повторов —
  # следующий провайдер или «офлайн».
  retries: 2
  retry_delay_seconds: 3
  providers:
    # OpenRouter — основной провайдер (SPEC 7). Ключ — в .env: OPENROUTER_API_KEY=sk-or-...
    # Оценка пачки и разбор указаний — DeepSeek V4.1 Flash: по живому тесту TestLiveEvaluation
    # выполняет указания руководства без ошибок, Gemma — нестабильно (SPEC 7). Ответы — Gemma 4 26B-A4B.
    # Цена Gemma (2026-11-08): ~$0.04–0.15 за 1 млн входных токенов и ~$0.10–0.60 за 1 млн выходных,
    # в зависимости от того, к какому хостеру OpenRouter направит запрос; DeepSeek — примерно вдвое дороже.
    # У платных моделей нет лимитов на число запросов → rpm/rpd = 0. Расходы ограничивайте
    # лимитом на ключе в OpenRouter (с ежедневным сбросом в 00:00 UTC): когда он исчерпан, бот
    # молчит («офлайн») до 00:00 UTC. Кончились деньги на счёте — «офлайн» на 10 минут и снова попытка.
    - name: openrouter
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      filter:
        model: deepseek/deepseek-v4.1-flash
        rpm: 0
        rpd: 0
        temperature: 0.3
        max_tokens: 1500             # список действий по всей пачке
        # JSON-схема ответа (response_format) для оценки и разбора указаний: хостер ограничивает ответ
        # схемой, и он всегда — один объект нужного вида (SPEC 7). У DeepSeek V4.1 Flash на OpenRouter
        # её поддерживает большинство хостеров; без require_parameters ниже запрос мог бы уйти хостеру,
        # который схему молча игнорирует.
        structured_outputs: true
        extra:
          reasoning: {enabled: false}      # без скрытых «размышлений»
          # data_collection: deny — не отправлять переписку хостерам, которые сохраняют или используют
          # данные запросов (сужает выбор хостеров и может немного поднять цену).
          # sort: price — из оставшихся хостеров сначала самый дешёвый (у DeepSeek V4.1 Flash цена
          # входа у хостеров различается в ~14 раз). Оценка идёт раз в час, кэш к ней всё равно остывает,
          # так что закрепление за хостером по сессии здесь ничего не даёт.
          # require_parameters: true — только хостеры, которые поддерживают все параметры запроса (схему тоже).
          provider: {data_collection: deny, sort: price, require_parameters: true}
      reply:
        model: google/gemma-4-26b-a4b-it
        rpm: 0
        rpd: 0
        temperature: 0.8
        max_tokens: 400
        extra:
          reasoning: {enabled: false}      # у Gemma 4 и так выключены
          # Без sort: ответы в ветке идут с session_id, и OpenRouter держит их у хостера с прогретым
          # кэшем (SPEC 7a); как sort сочетается с этим закреплением, документация не говорит.
          provider: {data_collection: deny}

    # Локальная модель: llama.cpp llama-server (docker compose --profile local, см. README).
    # Отдаёт OpenAI-совместимый API и обслуживает одну загруженную модель — имя model
    # используется только в логах. Можно оставить запасным провайдером после openrouter
    # или использовать вместо него.
    # - name: local
    #   base_url: http://llm:8080/v1          # без Docker: http://localhost:8080/v1
    #   filter:
    #     model: gemma-4-26b-a4b
    #     temperature: 0.3
    #     max_tokens: 1500
    #     extra:
    #       chat_template_kwargs: {enable_thinking: false}   # без скрытых «размышлений»: иначе они
    #                                                        # съедают max_tokens и ответ приходит пустым
    #   reply:
    #     model: gemma-4-26b-a4b
    #     temperature: 0.8
    #     max_tokens: 400
    #     extra:
    #       chat_template_kwargs: {enable_thinking: false}

storage:
  path: data/bot.db

persona_path: persona.md
log_level: info   # debug | info | warn | error
